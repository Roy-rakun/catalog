<script>
(function () {
    var source = 'https://stream.mux.com/BuGGTsiXq1T00WUb8qfURrHkTCbhrkfFLSv4uAOZzdhw.m3u8';
    var video = document.getElementById('catalog-bg-video');
    if (!video) {
        return;
    }

    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.addEventListener('ended', function () {
        video.currentTime = 0;
        playBackgroundVideo();
    });

    function playBackgroundVideo() {
        var playPromise = video.play();
        if (playPromise && playPromise.catch) {
            playPromise.catch(function () {});
        }
    }

    if (window.Hls && Hls.isSupported()) {
        var hls = new Hls({ enableWorker: true });
        hls.loadSource(source);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, playBackgroundVideo);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = source;
        video.addEventListener('loadedmetadata', playBackgroundVideo, { once: true });
    }
})();
</script>
